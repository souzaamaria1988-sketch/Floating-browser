name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: 🔧 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Grant execute permission for gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: 🔨 Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🔨 Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: ✅ Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-browser-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: ✅ Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-browser-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14

      - name: 📊 Build Summary
        run: |
          echo "## 🎉 Build Concluído!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Floating Browser APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Debug APK:** \`android/app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "**Release APK:** \`android/app/build/outputs/apk/release/app-release-unsigned.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Os arquivos estão disponíveis na seção **Artifacts** deste workflow." >> $GITHUB_STEP_SUMMARY
